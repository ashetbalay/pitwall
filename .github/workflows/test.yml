name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pitwall
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: pitwall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitwall -d pitwall_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://pitwall:test_password@127.0.0.1:5432/pitwall_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen --python ${{ matrix.python }} pytest -q

  frontend:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test

  container:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: docker compose exec -T app .venv/bin/python -m backend.import_data
      - run: docker compose exec -T app .venv/bin/alembic check
      - name: Wait for application and verify UI
        shell: python
        run: |
          import json
          import time
          from urllib.request import urlopen

          for attempt in range(60):
              try:
                  with urlopen('http://127.0.0.1:8000/api/health', timeout=2) as response:
                      assert json.load(response) == {'status': 'ok'}
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container did not become ready')
          with urlopen('http://127.0.0.1:8000/', timeout=2) as response:
              assert 'Pitwall' in response.read().decode()
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop container
        if: always()
        run: docker compose down --volumes
