services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitwall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitwall_local}
      POSTGRES_DB: ${POSTGRES_DB:-pitwall}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment: &database
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-pitwall}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pitwall_local}
      PGDATABASE: ${POSTGRES_DB:-pitwall}
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment: *database
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
